<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="企澄 Atlas：公开企业风险、股权、舆情与供应链研究入口。" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; script-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
    <title>企澄 Atlas · 公开入口</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #ffe500; color: #111; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 28px; }
      article { width: min(920px, 100%); border: 4px solid #111; background: #fffdf0; box-shadow: 14px 14px 0 #111; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; border-bottom: 4px solid #111; background: #3157ff; color: #fff; }
      .brand { font-weight: 950; letter-spacing: -.04em; font-size: clamp(24px, 4vw, 42px); }
      .tag { border: 3px solid #111; background: #54f2a8; color: #111; padding: 7px 10px; font-size: 12px; font-weight: 900; }
      .content { padding: clamp(28px, 6vw, 68px); }
      .eyebrow { margin: 0 0 12px; font: 900 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; }
      h1 { max-width: 720px; margin: 0; font-size: clamp(42px, 8vw, 86px); line-height: .96; letter-spacing: -.065em; }
      p { max-width: 680px; margin: 24px 0 0; font-size: clamp(17px, 2.2vw, 22px); line-height: 1.65; }
      .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }
      a { display: inline-flex; min-height: 52px; align-items: center; border: 3px solid #111; padding: 0 20px; color: #111; font-weight: 950; text-decoration: none; box-shadow: 6px 6px 0 #111; }
      a.primary { background: #54f2a8; }
      a.secondary { background: #fff; }
      a:hover, a:focus-visible { transform: translate(3px, 3px); box-shadow: 3px 3px 0 #111; outline: none; }
      footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-top: 4px solid #111; padding: 15px 22px; font: 800 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main>
      <article>
        <header>
          <div class="brand">企澄 ATLAS</div>
          <div class="tag">PUBLIC ACCESS</div>
        </header>
        <section class="content">
          <p class="eyebrow">A-SHARE · DUE DILIGENCE · RISK GRAPH</p>
          <h1>把公开证据<br />连成企业图谱。</h1>
          <p>面向A股公司的工商、股权穿透、司法、舆情、供应商与机构持仓研究入口。公开浏览无需登录；数据写入与人工复核仍由受保护的正式系统处理。</p>
          <div class="actions">
            <a class="primary" href="https://qicheng-atlas.lorna-sintbd.chatgpt.site/" rel="noreferrer">进入企澄 Atlas →</a>
            <a class="secondary" href="https://github.com/joy427/qicheng-atlas-public" rel="noreferrer">查看公开仓库</a>
          </div>
          <p style="font-size:13px;margin-top:24px">本页不会自动跳转。若正式站点在你所在的网络或地区不可用，本静态入口仍可正常保留；后续公开数据镜像也将发布在此仓库。</p>
        </section>
        <footer>
          <span>NO TOKENS · NO PRIVATE API CONFIG · NO USER TRACKING</span>
          <span>© 2026 QICHENG ATLAS</span>
        </footer>
      </article>
    </main>
  </body>
</html>
